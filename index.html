<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倫理　考査対策</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/intro.css">
  <script>
    try {
      if (!sessionStorage.getItem("ethics-intro-seen")) {
        sessionStorage.setItem("ethics-intro-seen", "1");
        document.documentElement.classList.add("is-intro");
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div class="intro" id="intro">
    <button type="button" class="intro-skip" id="intro-skip">skip</button>
    <canvas class="intro-clouds" id="intro-clouds" aria-hidden="true"></canvas>
    <div class="intro-line" aria-hidden="true">
      <span class="intro-glyph" id="intro-glyph"></span>
      <span class="intro-caret" id="intro-caret"></span>
    </div>
  </div>
  <div class="shell">
    <div class="bar">
      <a class="home g-logo-reveal" href="./" aria-label="最初の画面へ" data-page-transition="off">
        <img src="img/home.png" alt="" width="30" height="30">
      </a>
    </div>

    <main class="page">
      <header class="hero hero-home inner">
        <h1 class="g-clip-reveal">倫理　考査対策</h1>
      </header>

      <nav aria-label="考査">
        <ul class="nav-list">
          <li>
            <a
              class="nav-link inner"
              href="zenki-kimatu/"
              data-page-transition-mode="delayed"
              data-page-transition-before-exit="550"
              data-page-transition-after-exit="550"
            >
              <span class="nav-index g-clip-reveal">01</span>
              <span class="nav-name g-clip-reveal">前期期末考査</span>
            </a>
          </li>
          <li>
            <span class="nav-link inner is-disabled" aria-disabled="true">
              <span class="nav-index g-clip-reveal">02</span>
              <span class="nav-name g-clip-reveal">後期中間考査</span>
              <span class="nav-status g-clip-reveal">準備中</span>
            </span>
          </li>
          <li>
            <span class="nav-link inner is-disabled" aria-disabled="true">
              <span class="nav-index g-clip-reveal">03</span>
              <span class="nav-name g-clip-reveal">後期期末考査</span>
              <span class="nav-status g-clip-reveal">準備中</span>
            </span>
          </li>
        </ul>
      </nav>
    </main>
  </div>

  <script src="js/page-transition.js"></script>
  <script src="js/intro.js"></script>
</body>
</html>
