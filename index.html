<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倫理　考査対策</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --color-bg: #f5f5f5;
      --color-surface: #ffffff;
      --color-border: rgba(0,0,0,0.08);
      --color-divider: rgba(0,0,0,0.06);
      --color-text: #1d1d1f;
      --color-text-muted: #6e6e73;
      --color-text-faint: #aeaeb2;
      --color-primary: #0071e3;
      --color-toggle-bg: rgba(0,0,0,0.04);
      --color-toggle-hover: rgba(0,0,0,0.08);
      --color-row-hover: rgba(0,0,0,0.03);
      --shadow-md: 0 4px 24px rgba(0,0,0,0.07);
      --transition: 160ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    [data-theme="dark"] {
      --color-bg: #000000;
      --color-surface: #1c1c1e;
      --color-border: rgba(255,255,255,0.1);
      --color-divider: rgba(255,255,255,0.06);
      --color-text: #f5f5f7;
      --color-text-muted: #aeaeb2;
      --color-text-faint: #636366;
      --color-primary: #2997ff;
      --color-toggle-bg: rgba(255,255,255,0.07);
      --color-toggle-hover: rgba(255,255,255,0.13);
      --color-row-hover: rgba(255,255,255,0.05);
      --shadow-md: 0 4px 24px rgba(0,0,0,0.4);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --color-bg: #000000;
        --color-surface: #1c1c1e;
        --color-border: rgba(255,255,255,0.1);
        --color-divider: rgba(255,255,255,0.06);
        --color-text: #f5f5f7;
        --color-text-muted: #aeaeb2;
        --color-text-faint: #636366;
        --color-primary: #2997ff;
        --color-toggle-bg: rgba(255,255,255,0.07);
        --color-toggle-hover: rgba(255,255,255,0.13);
        --color-row-hover: rgba(255,255,255,0.05);
        --shadow-md: 0 4px 24px rgba(0,0,0,0.4);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Helvetica Neue', sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      min-height: 100dvh;
      line-height: 1.75;
      font-size: clamp(1rem, 0.95rem + 0.25vw, 1.0625rem);
      padding: clamp(16px, 4vw, 40px);
      transition: background-color var(--transition), color var(--transition);
    }

    .container {
      max-width: 740px;
      margin: 0 auto;
      background: var(--color-surface);
      padding: clamp(24px, 5vw, 48px);
      border-radius: 18px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--color-border);
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(1.2rem, 1rem + 0.8vw, 1.55rem);
      font-weight: 600;
      color: var(--color-text);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .lead {
      color: var(--color-text-muted);
      font-size: 0.9375rem;
      margin-bottom: 28px;
    }

    .theme-toggle {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--color-toggle-bg);
      border: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--color-text-muted);
      transition: background var(--transition), color var(--transition);
    }
    .theme-toggle:hover { background: var(--color-toggle-hover); color: var(--color-text); }
    .theme-toggle:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .unit-list {
      list-style: none;
      border: 1px solid var(--color-border);
      border-radius: 14px;
      overflow: hidden;
    }

    .unit-list li + li {
      border-top: 1px solid var(--color-divider);
    }

    .unit-link {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 18px;
      color: inherit;
      text-decoration: none;
      transition: background var(--transition);
    }
    .unit-link:hover { background: var(--color-row-hover); }
    .unit-link:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: -2px;
    }
    .unit-link:active { background: var(--color-toggle-hover); }
    .unit-link.is-disabled {
      opacity: 0.45;
      pointer-events: none;
    }

    .unit-index {
      flex-shrink: 0;
      width: 2em;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--color-text-faint);
      font-variant-numeric: tabular-nums;
    }

    .unit-name {
      flex: 1;
      font-size: 1.0625rem;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .unit-chevron {
      flex-shrink: 0;
      color: var(--color-text-faint);
    }

    .unit-status {
      flex-shrink: 0;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--color-text-faint);
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>倫理　考査対策</h1>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="ダークモードに切り替え">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/>
        </svg>
      </button>
    </header>
    <p class="lead">考査を選んでください</p>

    <nav aria-label="考査">
      <ul class="unit-list">
        <li>
          <a class="unit-link" href="zenki-kimatu/">
            <span class="unit-index">01</span>
            <span class="unit-name">前期期末</span>
            <svg class="unit-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </a>
        </li>
        <li>
          <span class="unit-link is-disabled" aria-disabled="true">
            <span class="unit-index">02</span>
            <span class="unit-name">後期中間</span>
            <span class="unit-status">準備中</span>
          </span>
        </li>
        <li>
          <span class="unit-link is-disabled" aria-disabled="true">
            <span class="unit-index">03</span>
            <span class="unit-name">後期期末</span>
            <span class="unit-status">準備中</span>
          </span>
        </li>
      </ul>
    </nav>
  </main>

  <script>
    (function () {
      const toggle = document.querySelector('[data-theme-toggle]');
      const root = document.documentElement;
      let dark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      const moon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>';
      const sun = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';

      function apply() {
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        toggle.innerHTML = dark ? sun : moon;
        toggle.setAttribute('aria-label', dark ? 'ライトモードに切り替え' : 'ダークモードに切り替え');
      }

      apply();
      toggle.addEventListener('click', function () {
        dark = !dark;
        apply();
      });
    })();
  </script>
</body>
</html>
